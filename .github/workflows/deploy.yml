name: Build and Push UI to GHCR

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ghcr.io/mtickle/patrolx-map:latest
          build-args: |
            VITE_PATROLX_API_URL=${{ secrets.VITE_PATROLX_API_URL }}
            VITE_PATROLX_API_KEY=${{ secrets.VITE_PATROLX_API_KEY }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_INCIDENT_POLL_MS=${{ secrets.VITE_INCIDENT_POLL_MS }}
            VITE_DEFAULT_LAT=${{ secrets.VITE_DEFAULT_LAT }}
            VITE_DEFAULT_LNG=${{ secrets.VITE_DEFAULT_LNG }}
            VITE_DEFAULT_ZOOM=${{ secrets.VITE_DEFAULT_ZOOM }}
            VITE_DEFAULT_COUNTY=${{ secrets.VITE_DEFAULT_COUNTY }}